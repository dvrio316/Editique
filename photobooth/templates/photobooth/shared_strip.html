<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editique - Photo Strip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #151515;
      --paper: #ffffff;
      --bg: #f4f4f4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Gochi Hand', cursive;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #f7f7f7;
      border: 3px solid var(--ink);
      border-radius: 30px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      text-align: center;
    }
    .title-box {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      letter-spacing: 0.16em;
      background: #fff;
      border: 2px solid var(--ink);
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      padding: 0.2rem 1rem;
      font-size: 1rem;
    }
    .heading {
      font-size: 1.75rem;
      line-height: 1.2;
    }
    .strip-wrapper {
      background: #fff;
      border: 3px solid var(--ink);
      box-shadow: 5px 6px 0 var(--ink);
      padding: 0.5rem;
      max-width: 260px;
      border-radius: 6px;
    }
    .strip-img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 2px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: inherit;
      font-size: 1.25rem;
      cursor: pointer;
      text-decoration: none;
      padding: 0.5rem 1.8rem;
      border: 3px solid var(--ink);
      border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
      transition: background 0.1s;
    }
    .btn-primary {
      background: var(--ink);
      color: #fff;
    }
    .btn-primary:hover {
      background: #333;
    }
    .btn-outline {
      background: #fff;
      color: var(--ink);
    }
    .btn-outline:hover {
      background: #e9e9e9;
    }
    .expired-box {
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: 1.5rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }
    .notice {
      font-size: 0.95rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-box">EDITIQUE</div>

    {% if error %}
      <div class="expired-box">
        <span style="font-size: 2.5rem;">⌛</span>
        <h2 class="heading" style="color: #c0262d;">QR Code Notice</h2>
        <p style="font-size: 1.2rem; line-height: 1.4;">{{ error }}</p>
      </div>
      <a href="/" class="btn btn-outline">Back to Photo Booth</a>
    {% else %}
      <h2 class="heading">Your Photo Strip!</h2>
      <div class="strip-wrapper">
        <img class="strip-img" src="{{ strip.image.url }}" alt="Your Customized Photo Strip">
      </div>
      <a href="{{ download_url }}" class="btn btn-primary" download>Download Photo Strip ⬇</a>
      <p class="notice">This link is valid for 24 hours from creation.</p>
      <a href="/" class="btn btn-outline" style="font-size: 1rem; padding: 0.35rem 1.2rem;">Back to Booth</a>
    {% endif %}
  </div>
</body>
</html>
